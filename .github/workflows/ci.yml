name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API + SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "apps/api[dev]" -e "packages/sdk-python[dev]"
      - name: Test
        run: pytest apps/api/tests packages/sdk-python/tests -q

  web:
    name: Dashboard typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
